# Replace BENZIN_HOST before installing. Certbot adds HTTPS afterward.
server {
    listen 80;
    listen [::]:80;
    server_name BENZIN_HOST;
    root /var/www/benzin;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    location / { try_files $uri $uri/ =404; }
    location ~ ^/(api|acces)/ {
        limit_req zone=benzin_api burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:18766;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 15s;
        client_max_body_size 4k;
        access_log off;
    }
    location /vendor/ruffle/ { expires 7d; try_files $uri =404; }
}
